<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Selah — Study Bible</title>
<meta name="description" content="Selah — a phone-first study Bible: ASV and WEB text, cross-references, Gospel parallels and typology.">
<meta name="theme-color" content="#faf6ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171310" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="img/icons/favicon-64.png?v=32">
<link rel="apple-touch-icon" href="img/icons/icon-180.png?v=32">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Selah">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="style.css?v=32">
</head>
<body>
<header id="topbar">
  <div class="brand">
    <div class="brand-name">Selah</div>
    <div class="brand-sub">Study Bible</div>
  </div>
  <div class="top-actions">
    <span class="offline-badge hidden" id="offlineBadge">Offline</span>
    <button class="trans-badge" id="transBtn" aria-label="Switch translation">ASV 1901</button>
    <button id="fsDec" class="icon-btn fs-btn" aria-label="Smaller text">A−</button>
    <button id="fsInc" class="icon-btn fs-btn" aria-label="Larger text">A+</button>
    <button id="themeBtn" class="icon-btn" aria-label="Toggle theme">◐</button>
    <button id="settingsBtn" class="icon-btn" aria-label="Settings">⚙</button>
  </div>
</header>

<main id="view"></main>

<nav id="tabbar">
  <button data-view="home" class="active">Home</button>
  <button data-view="read">Read</button>
  <button data-view="search">Search</button>
  <button data-view="christ">Christ</button>
  <button data-view="images">Images</button>
  <button data-view="saved">Saved</button>
</nav>

<div id="sheetWrap" class="hidden">
  <div id="sheetScrim"></div>
  <div id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetRef">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <div id="sheetRef" class="sheet-ref"></div>
      <div class="sheet-actions"><button id="sheetShare" class="icon-btn" aria-label="Share as image">⇪</button><button id="sheetClose" class="icon-btn" aria-label="Close">✕</button></div>
    </div>
    <div id="sheetTabs" class="sheet-tabs" role="tablist">
      <button role="tab" data-tab="xrefs" class="active">Cross-refs</button>
      <button role="tab" data-tab="comment">Commentary</button>
      <button role="tab" data-tab="original">Hebrew</button>
      <button role="tab" data-tab="parallels">Parallels</button>
      <button role="tab" data-tab="typology">Typology</button>
      <button role="tab" data-tab="words">Words</button>
      <button role="tab" data-tab="mark">Mark</button>
    </div>
    <div id="sheetBody" class="sheet-body"></div>
  </div>
</div>

<div id="lightbox" class="hidden" role="dialog" aria-modal="true" aria-label="Image viewer">
  <button class="lb-close icon-btn" aria-label="Close">✕</button>
  <img alt="">
  <div class="lb-bar"><button class="lb-prev" aria-label="Previous picture">‹</button><div class="lb-cap"></div><button class="lb-next" aria-label="Next picture">›</button></div>
</div>

<div id="settingsWrap" class="hidden">
  <div id="settingsScrim"></div>
  <div id="settingsPanel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="sheet-handle"></div>
    <div class="sheet-head"><div id="settingsTitle" class="sheet-ref">Settings</div><button id="settingsClose" class="icon-btn" aria-label="Close">✕</button></div>
    <div id="settingsBody" class="sheet-body"></div>
  </div>
</div>

<div id="toast" class="hidden" role="status" aria-live="polite"></div>

<script src="app.js?v=32"></script>
<script src="pictures.js?v=32"></script>
<script src="book.js?v=32"></script>
<script src="lexicon.js?v=32"></script>
<script src="plans.js?v=32"></script>
<script src="readaloud.js?v=32"></script>
<script src="share.js?v=32"></script>
<script src="sync.js?v=32"></script>
<script src="router.js?v=32"></script>
<script src="settings.js?v=32"></script>
<script src="commentary.js?v=32"></script>
<script src="search.js?v=32"></script>
<script src="maps.js?v=32"></script>
<script src="timeline.js?v=32"></script>
<script src="memory.js?v=32"></script>
<script src="journal.js?v=32"></script>
<script src="trivia.js?v=32"></script>
<script src="reminder.js?v=32"></script>
</body>
</html>
