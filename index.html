<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Selah — Study Bible</title>
<meta name="description" content="Selah — a phone-first study Bible: ASV and WEB text, cross-references, Gospel parallels and typology.">
<meta name="theme-color" content="#faf6ec">
<link rel="stylesheet" href="style.css?v=8">
</head>
<body>
<header id="topbar">
  <div class="brand">
    <div class="brand-name">Selah</div>
    <div class="brand-sub">Study Bible</div>
  </div>
  <div class="top-actions">
    <button class="trans-badge" id="transBtn" aria-label="Switch translation">ASV 1901</button>
    <button id="fsDec" class="icon-btn fs-btn" aria-label="Smaller text">A−</button>
    <button id="fsInc" class="icon-btn fs-btn" aria-label="Larger text">A+</button>
    <button id="themeBtn" class="icon-btn" aria-label="Toggle theme">◐</button>
  </div>
</header>

<main id="view"></main>

<nav id="tabbar">
  <button data-view="home" class="active">Home</button>
  <button data-view="read">Read</button>
  <button data-view="search">Search</button>
  <button data-view="christ">Christ</button>
  <button data-view="images">Images</button>
  <button data-view="saved">Saved</button>
</nav>

<div id="sheetWrap" class="hidden">
  <div id="sheetScrim"></div>
  <div id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetRef">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <div id="sheetRef" class="sheet-ref"></div>
      <button id="sheetClose" class="icon-btn" aria-label="Close">✕</button>
    </div>
    <div id="sheetTabs" class="sheet-tabs" role="tablist">
      <button data-tab="xrefs" class="active">Cross-refs</button>
      <button data-tab="original">Hebrew</button>
      <button data-tab="parallels">Parallels</button>
      <button data-tab="typology">Typology</button>
      <button data-tab="words">Words</button>
      <button data-tab="mark">Mark</button>
    </div>
    <div id="sheetBody" class="sheet-body"></div>
  </div>
</div>

<div id="lightbox" class="hidden" role="dialog" aria-modal="true" aria-label="Image viewer">
  <button class="lb-close icon-btn" aria-label="Close">✕</button>
  <img alt="">
  <div class="lb-bar"><button class="lb-prev" aria-label="Previous picture">‹</button><div class="lb-cap"></div><button class="lb-next" aria-label="Next picture">›</button></div>
</div>

<div id="toast" class="hidden" role="status" aria-live="polite"></div>

<script src="app.js?v=8"></script>
<script src="book.js?v=8"></script>
<script src="lexicon.js?v=8"></script>
</body>
</html>
